# ── Test profile ──────────────────────────────────────────────────────────
# Used by integration tests (@ActiveProfiles("test")). Overrides the production
# application.properties so tests NEVER touch the real MongoDB Atlas cluster.

# Embedded MongoDB (flapdoodle). The spring31x auto-config starts a throwaway
# mongod on a random port and overrides the Mongo connection details, so the
# Atlas URI in the main application.properties is ignored during tests.
de.flapdoodle.mongodb.embedded.version=7.0.2
spring.data.mongodb.database=krishi_shetra_test

# Deterministic JWT config for tests (>= 32 bytes for HS256).
app.jwt.secret=test-jwt-secret-key-for-krishi-shetra-integration-tests-2026
app.jwt.expiration-ms=3600000

app.cors.allowed-origins=http://localhost:3000

# Quieter logs during test runs
logging.level.com.krishishetra=INFO
logging.level.org.springframework=WARN
logging.level.de.flapdoodle=INFO
